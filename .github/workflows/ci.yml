name: Check babel build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lib/ is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check committed lib/ matches a fresh build
        run: git diff --exit-code -- lib/
